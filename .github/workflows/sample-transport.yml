name: Sample transport prototype

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'lab_transport/**'
      - 'scenarios/**'
      - 'tests/**'
      - '.github/workflows/sample-transport.yml'
  pull_request:
    paths:
      - 'lab_transport/**'
      - 'scenarios/**'
      - 'tests/**'
      - '.github/workflows/sample-transport.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test sample lifecycle, prediction and grid invariants
        run: python -m unittest discover -s tests -v
      - name: Run the example with both policies
        run: python -m lab_transport compare --seed 42 --output "$RUNNER_TEMP/sample-transport-demo"
      - name: Test playback controls
        run: node tests/test_playback.js "$RUNNER_TEMP/sample-transport-demo/world/report.html"
      - name: Run the pinned published hospital navigation graph
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://raw.githubusercontent.com/scafld/covsg24_fleet_backend/b9e32eeebb3a568af0e41c6e34500076cd2f6cad/covsg24_environments/environments/hospital_2nd_floor/hospital_2nd_floor.building.yaml'
          curl --fail --location --silent --show-error --retry 3 "$source_url" --output "$RUNNER_TEMP/hospital.building.yaml"
          python -m lab_transport.hospital_case --map-file "$RUNNER_TEMP/hospital.building.yaml" --output "$RUNNER_TEMP/hospital-run"
          python tests/check_hospital_run.py "$RUNNER_TEMP/hospital.building.yaml" "$RUNNER_TEMP/hospital-run"
          node tests/test_graph_playback.js "$RUNNER_TEMP/hospital-run/world/report.html"
      - name: Check hospital graph in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --dump-dom "file://$RUNNER_TEMP/hospital-run/world/report.html?step=1" \
            > "$RUNNER_TEMP/hospital-dom.html" 2> "$RUNNER_TEMP/hospital-chrome.log"
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import os

          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.circles = self.lines = 0
                  self.visible_text = ''
              def handle_starttag(self, tag, attrs):
                  self.circles += tag == 'circle'
                  self.lines += tag == 'line'
              def handle_data(self, data):
                  self.visible_text += data

          check = Check()
          check.feed((Path(os.environ['RUNNER_TEMP']) / 'hospital-dom.html').read_text())
          assert (check.circles, check.lines) == (32, 63), (check.circles, check.lines)
          assert '未设置时限' in check.visible_text
          assert '功能测试设置' in check.visible_text
          print('Browser DOM verified: hospital graph, directed lanes, test-data notice and no deadline')
          PY
      - name: Check the standalone playback in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          if ! timeout 45s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --no-first-run --dump-dom "file://$RUNNER_TEMP/sample-transport-demo/world/report.html?step=1" \
            > "$RUNNER_TEMP/report-dom.html" 2> "$RUNNER_TEMP/chrome.log"; then
            tail -n 100 "$RUNNER_TEMP/chrome.log" >&2
            exit 1
          fi
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import os

          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.cells = self.robots = self.rows = self.candidates = 0
                  self.in_metrics = False
                  self.in_decision = False
                  self.metrics = ''
                  self.decision = ''
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  classes = attrs.get('class', '').split()
                  self.cells += 'cell' in classes
                  self.robots += 'robot' in classes
                  self.rows += tag == 'tr'
                  self.candidates += tag == 'li'
                  if attrs.get('id') == 'metrics':
                      self.in_metrics = True
                  if attrs.get('id') == 'decision':
                      self.in_decision = True
              def handle_endtag(self, tag):
                  if tag == 'p':
                      self.in_metrics = False
                      self.in_decision = False
              def handle_data(self, data):
                  if self.in_metrics:
                      self.metrics += data
                  if self.in_decision:
                      self.decision += data

          check = Check()
          check.feed((Path(os.environ['RUNNER_TEMP']) / 'report-dom.html').read_text())
          assert (check.cells, check.robots, check.rows) == (63, 2, 7), (check.cells, check.robots, check.rows)
          assert '6/6' in check.metrics, check.metrics
          assert '预测第' in check.decision and check.candidates > 0, (check.decision, check.candidates)
          print('Browser DOM verified: map, robots, tasks and candidate predictions')
          PY
      - name: Upload example results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample-transport-demo
          path: ${{ runner.temp }}/sample-transport-demo/
          if-no-files-found: warn
          retention-days: 7
